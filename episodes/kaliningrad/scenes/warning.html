<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #warning-stage { display: flex; flex-direction: column; }
        #warning-head { width: 100%; }
        #warning-a { position: absolute; left: 0; right: 0; top: 50%; margin-top: -170px; }
        #warning-a .headline { font-size: 96px; max-width: 1450px; }
        #warning-b { position: absolute; left: 0; right: 0; top: 120px; }
        #warning-cards { display: flex; gap: 40px; }
        #warning-cards .panel { flex: 1; }
        #warning-cards .k { font-family: var(--font-sans); font-weight: 700; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); }
        #warning-cards .t { font-size: 42px; line-height: 1.25; color: var(--ink); margin-top: 10px; }
        #warning-quote { font-size: 56px; line-height: 1.3; margin-top: 56px; }
        #warning-centres { margin-top: 36px; padding-left: 62px; font-size: 44px; }
        #warning-src { position: absolute; left: 0; bottom: 0; }
      </style>

      <div id="root" data-composition-id="scene-warning" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="warning-stage" class="stage">
          <div id="warning-head" class="section-head"><div id="warning-rule" class="section-rule"></div><div id="warning-label" class="label">Russia’s warning · September 2026</div></div>
          <div id="warning-a"><h1 id="warning-hl" class="headline">Russia will defend Kaliningrad with <span class="red">nuclear weapons</span></h1></div>
          <div id="warning-b">
            <div id="warning-cards">
              <div id="warning-c1" class="panel"><div class="k">28–29 September</div><div class="body t">Russian embassies in Belgium, Britain and Ireland</div></div>
              <div id="warning-c2" class="panel"><div class="k">Diplomatic note</div><div class="body t">A formal note to NATO</div></div>
            </div>
            <blockquote id="warning-quote" class="quote">If NATO tries to blockade or isolate Kaliningrad: “the entire arsenal of forces and capabilities at its disposal, <span id="warning-wash" class="hl">including nuclear weapons</span>.”</blockquote>
            <p id="warning-centres" class="standfirst">War could begin with strikes on <span class="red">“decision-making centres”</span> in NATO countries.</p>
          </div>
          <div id="warning-src" class="byline">Sources: Russian embassy statements and note to NATO, via WSWS, 30 Sep 2026</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 41.8333, "voStart": 0.6, "voEnd": 40.942, "cues": {"nuclear": 5.17, "embassies": 8.86, "note": 16.54, "quote": 27.08, "key": 31.37, "centres": 37.24}, "paragraphs": [0.6, 7.273]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("warning");
          rise("#warning-hl", 0.4, 40, 0.8);
          const e = cue("embassies", 5);
          out("#warning-a", e - 0.6, 0.45);
          rise("#warning-c1", e, 24);
          rise("#warning-c2", cue("note", e + 3), 24);
          tl.fromTo("#warning-quote", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, cue("quote", e + 6) - 0.2);
          wash("#warning-wash", cue("key", e + 9));
          rise("#warning-centres", cue("centres", e + 12) - 0.3, 20);
          fade("#warning-src", e + 1);

          tl.to("#warning-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-warning"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
