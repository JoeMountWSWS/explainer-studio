<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #workers-stage { display: flex; flex-direction: column; justify-content: center; }
        #workers-hl { font-size: 112px; }
        #workers-list { display: flex; gap: 0; margin-top: 56px; border-top: 6px solid var(--ink); }
        #workers-list .c { flex: 1; padding: 26px 0 0; font-family: var(--font-sans); font-weight: 700; font-size: 40px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
        #workers-fight { margin-top: 64px; font-size: 52px; color: var(--ink); }
        #workers-pay { margin-top: 18px; font-size: 52px; color: var(--ink); }
      </style>

      <div id="root" data-composition-id="scene-workers" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="workers-stage" class="stage">
          <div id="workers-tag" class="tag">The force that can stop the war</div>
          <h1 id="workers-hl" class="headline" style="margin-top: 32px"><span id="workers-wash" class="hl">The international working class</span></h1>
          <div id="workers-list">
            <div id="workers-c1" class="c">Russia</div><div id="workers-c2" class="c">Ukraine</div><div id="workers-c3" class="c">Europe</div><div id="workers-c4" class="c">United States</div>
          </div>
          <p id="workers-fight" class="body">They do the fighting and the dying,</p>
          <p id="workers-pay" class="body">and they pay for rearmament <span class="red">through austerity</span>.</p>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 18.8667, "voStart": 0.6, "voEnd": 17.969, "cues": {"wc": 2.74, "list": 6.22, "fight": 12.92, "pay": 15.27}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          rise("#workers-tag", 0.2, 16, 0.5);
          const w = cue("wc", 2.5);
          rise("#workers-hl", w - 0.4, 36, 0.8);
          wash("#workers-wash", w + 0.6);
          const l = cue("list", 5.5);
          tl.fromTo("#workers-list", { borderTopColor: "rgba(35,31,32,0)" }, { borderTopColor: "rgba(35,31,32,1)", duration: 0.6 }, l - 0.5);
          ["c1", "c2", "c3", "c4"].forEach((c, i) => rise(`#workers-${c}`, l + i * 0.6, 16, 0.5));
          rise("#workers-fight", cue("fight", 11) - 0.3, 20);
          rise("#workers-pay", cue("pay", 14) - 0.3, 20);

          tl.to("#workers-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-workers"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
