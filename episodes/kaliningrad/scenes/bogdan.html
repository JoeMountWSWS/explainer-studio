<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #bogdan-stage { display: flex; gap: 72px; }
        #bogdan-left { width: 620px; flex: none; display: flex; flex-direction: column; justify-content: center; }
        #bogdan-name { font-size: 88px; margin-top: 28px; }
        #bogdan-desc { margin-top: 28px; font-size: 42px; }
        #bogdan-years { margin-top: 40px; font-family: var(--font-serif); font-weight: 700; font-size: 120px; line-height: 1; color: var(--red); }
        #bogdan-years small { display: block; font-family: var(--font-sans); font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); margin-top: 8px; }
        #bogdan-right { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        #bogdan-src { position: absolute; left: 0; bottom: 0; font-size: 22px; }
                #bogdan-rows { list-style: none; margin: 40px 0 0; padding: 0; }
                #bogdan-rows li { display: flex; gap: 32px; align-items: baseline; padding: 24px 0; border-top: var(--hairline); }
                #bogdan-rows li:first-child { border-top: 0; }
                #bogdan-rows .k { font-family: var(--font-sans); font-weight: 700; font-size: 32px; letter-spacing: 0.04em; color: var(--red); min-width: 220px; flex: none; }
                #bogdan-rows .t { font-size: 36px; line-height: 1.28; color: var(--ink); }
      </style>

      <div id="root" data-composition-id="scene-bogdan" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="bogdan-stage" class="stage">
          <div id="bogdan-left">
            <div id="bogdan-tag" class="tag">Political prisoner</div>
            <h1 id="bogdan-name" class="headline">Bogdan Syrotiuk</h1>
            <p id="bogdan-desc" class="standfirst">27, Ukrainian socialist, leader of the Young Guard of Bolshevik-Leninists</p>
            <div id="bogdan-years">15 years<small>for “high treason”</small></div>
          </div>
          <div id="bogdan-right">
            <ul id="bogdan-rows">
              <li id="bogdan-r1"><span class="k">April 2024</span><span class="body t">Arrested</span></li>
              <li id="bogdan-r2"><span class="k">10 Aug 2026</span><span class="body t">Sentenced by a court in Pervomaisk</span></li>
              <li id="bogdan-r3"><span class="k">His offence</span><span class="body t">Writing articles calling on <span id="bogdan-wash" class="hl">Ukrainian and Russian workers to unite</span> against the war</span></li>
              <li id="bogdan-r4"><span class="k">Now</span><span class="body t">His lawyers have appealed</span></li>
            </ul>
          </div>
          <div id="bogdan-src" class="byline">Sources: WSWS, 11 Aug and 26 Sep 2026</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 30.6667, "voStart": 0.6, "voEnd": 29.758, "cues": {"age": 4.68, "arrested": 11.7, "sentenced": 14.54, "years": 19.29, "offence": 23.03, "appeal": 28.45}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          rise("#bogdan-tag", 0.2, 16, 0.5);
          rise("#bogdan-name", 0.35, 40, 0.8);
          rise("#bogdan-desc", cue("age", 3) - 0.3, 20);
          rise("#bogdan-r1", cue("arrested", 9) - 0.2, 20);
          const s = cue("sentenced", 12);
          rise("#bogdan-r2", s - 0.2, 20);
          rise("#bogdan-years", cue("years", s + 4) - 0.2, 30, 0.7);
          const o = cue("offence", 20);
          rise("#bogdan-r3", o - 0.4, 20);
          wash("#bogdan-wash", o + 2.4);
          rise("#bogdan-r4", cue("appeal", 27) - 0.2, 20);
          fade("#bogdan-src", 1.5);

          tl.to("#bogdan-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-bogdan"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
