<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #home-stage { display: flex; flex-direction: column; }
        #home-head { width: 100%; }
        #home-cols { display: flex; gap: 40px; margin-top: 44px; }
        #home-cols .panel { flex: 1; }
        #home-cols .k { font-family: var(--font-sans); font-weight: 700; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); }
        #home-cols .t { font-size: 44px; line-height: 1.28; color: var(--ink); margin-top: 12px; }
        #home-france { margin-top: 44px; display: flex; gap: 40px; align-items: baseline; }
        #home-france .big { font-family: var(--font-serif); font-weight: 700; font-size: 80px; line-height: 1.05; color: var(--ink); }
        #home-france .k { font-family: var(--font-sans); font-weight: 700; font-size: 32px; color: var(--red); min-width: 160px; }
        #home-france .t { font-size: 40px; color: var(--ink-2); margin-top: 6px; }
        #home-end { position: absolute; left: 0; right: 0; bottom: 0; font-size: 50px; }
      </style>

      <div id="root" data-composition-id="scene-home" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="home-stage" class="stage">
          <div id="home-head" class="section-head"><div id="home-rule" class="section-rule"></div><div id="home-label" class="label">War at home</div></div>
          <div id="home-cols">
            <div id="home-c1" class="panel"><div class="k">Cuts</div><p class="body t">Jobs, wages and public services, to pay for rearmament</p></div>
            <div id="home-c2" class="panel"><div class="k">Resistance</div><p class="body t">Growing across Europe</p></div>
          </div>
          <div id="home-france"><span class="k">France</span><div><div class="big">Hundreds of thousands</div><p class="body t">of workers and students strike and march against austerity</p></div></div>
          <blockquote id="home-end" class="quote">An enemy abroad: to demand national unity and to justify <span id="home-wash" class="hl">repression at home</span>.</blockquote>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 25.1667, "voStart": 0.6, "voEnd": 24.28, "cues": {"home": 1.99, "cuts": 5.38, "resist": 9.88, "france": 11.81, "unity": 20.5, "repression": 22.6}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("home");
          rise("#home-c1", cue("cuts", 3) - 0.4, 20);
          rise("#home-c2", cue("resist", 8) - 0.2, 20);
          rise("#home-france", cue("france", 11) - 0.3, 20);
          const u = cue("unity", 20);
          tl.fromTo("#home-end", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, u - 1.6);
          wash("#home-wash", cue("repression", u + 2));

          tl.to("#home-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-home"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
