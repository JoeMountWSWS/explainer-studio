<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #governments-stage { display: flex; flex-direction: column; }
        #governments-head { width: 100%; }
        #governments-hl { font-size: 96px; margin-top: 44px; max-width: 1500px; }
        #governments-cols { display: flex; gap: 40px; margin-top: 56px; }
        #governments-cols .panel { flex: 1; }
        #governments-cols .k { font-family: var(--font-sans); font-weight: 700; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
        #governments-cols .t { font-size: 46px; line-height: 1.25; color: var(--ink); margin-top: 12px; font-weight: 700; }
        #governments-fears { font-size: 34px; margin-top: 20px; }
      </style>

      <div id="root" data-composition-id="scene-governments" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="governments-stage" class="stage">
          <div id="governments-head" class="section-head"><div id="governments-rule" class="section-rule"></div><div id="governments-label" class="label">Part 5 · What can stop it</div></div>
          <h1 id="governments-hl" class="headline">No government in this conflict will <span id="governments-wash" class="hl">end it</span></h1>
          <div id="governments-cols">
            <div id="governments-c1" class="panel"><div class="k">The European powers</div><p class="body t">Committed to escalation</p></div>
            <div id="governments-c2" class="panel"><div class="k">The Putin regime</div><p class="body t">Nationalism and nuclear threats</p><p id="governments-fears" class="standfirst">It cannot appeal to workers abroad: it represents an oligarchy that fears its own working class</p></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 25.0333, "voStart": 0.6, "voEnd": 24.145, "cues": {"none": 0.61, "europe": 4.87, "putin": 8.33, "fears": 20.21}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("governments");
          const n = cue("none", 0.6);
          rise("#governments-hl", n, 36, 0.8);
          wash("#governments-wash", n + 2.2);
          rise("#governments-c1", cue("europe", 4) - 0.3, 24);
          rise("#governments-c2", cue("putin", 7) - 0.3, 24);
          tl.set("#governments-fears", { opacity: 0 }, 0);
          fade("#governments-fears", cue("fears", 14) - 3.5, 0.6);

          tl.to("#governments-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-governments"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
