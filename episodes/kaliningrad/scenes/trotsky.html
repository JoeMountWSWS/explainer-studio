<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #trotsky-photo { position: absolute; left: 0; top: 0; bottom: 0; width: 600px; overflow: hidden; }
        #trotsky-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; filter: grayscale(1) contrast(1.05); }
        #trotsky-credit { position: absolute; left: 32px; right: 32px; bottom: 120px; color: #ffffff; font-size: 22px; background: rgba(20,20,20,0.78); padding: 6px 12px; }
        #trotsky-stage { left: 720px; right: 140px; display: flex; flex-direction: column; justify-content: center; }
        #trotsky-head { width: 100%; }
        #trotsky-a { margin-top: 40px; }
        #trotsky-a .row { display: flex; gap: 32px; align-items: baseline; padding: 22px 0; border-top: var(--hairline); }
        #trotsky-a .row:first-child { border-top: 0; }
        #trotsky-a .k { font-family: var(--font-sans); font-weight: 700; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); min-width: 250px; }
        #trotsky-a .v { font-family: var(--font-serif); font-weight: 700; font-size: 56px; line-height: 1.15; color: var(--ink); }
        #trotsky-quote { font-size: 60px; line-height: 1.3; margin-top: 56px; }
        #trotsky-src { margin-top: 24px; padding-left: 62px; }
      </style>

      <div id="root" data-composition-id="scene-trotsky" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="trotsky-photo"><img id="trotsky-img" data-layout-allow-overflow src="assets/media/trotsky.jpg" alt="" /><div id="trotsky-credit" class="byline">Leon Trotsky, 1930s. Public domain</div></div>
        <div id="trotsky-stage" class="stage">
          <div id="trotsky-head" class="section-head"><div id="trotsky-rule" class="section-rule"></div><div id="trotsky-label" class="label">Trotsky: the contradiction</div></div>
          <div id="trotsky-a">
            <div id="trotsky-r1" class="row"><span class="k">Production</span><span class="v">international</span></div>
            <div id="trotsky-r2" class="row"><span class="k">The world</span><span class="v red">rival nation-states</span></div>
          </div>
          <blockquote id="trotsky-quote" class="quote">“A revolt of the forces of production against <span id="trotsky-wash" class="hl">the political form of nation and state</span>.”</blockquote>
          <div id="trotsky-src" class="byline">Leon Trotsky, <span class="italic">The War and the International</span>, 1914</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 27.0667, "voStart": 0.6, "voEnd": 26.157, "cues": {"intl": 9.12, "nations": 12.93, "quote": 21.25}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          fade("#trotsky-photo", 0, 0.6);
          tl.fromTo("#trotsky-img", { scale: 1.06 }, { scale: 1, duration: T.duration, ease: "none" }, 0);
          head("trotsky", 0.3);
          rise("#trotsky-r1", cue("intl", 6) - 0.2, 20);
          rise("#trotsky-r2", cue("nations", 9) - 0.2, 20);
          const q = cue("quote", 16);
          tl.fromTo("#trotsky-quote", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, q - 0.3);
          fade("#trotsky-src", q + 0.4);
          wash("#trotsky-wash", q + 2.6);

          tl.to("#trotsky-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-trotsky"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
