<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #ukraine-stage { display: flex; flex-direction: column; }
        #ukraine-head { width: 100%; }
        #ukraine-hl { font-size: 84px; margin-top: 44px; max-width: 1450px; }
        #ukraine-cols { display: flex; gap: 40px; margin-top: 56px; }
        #ukraine-cols .panel { flex: 1; }
        #ukraine-cols .n { font-family: var(--font-sans); font-weight: 700; font-size: 30px; color: var(--red); }
        #ukraine-cols .t { font-size: 52px; font-weight: 700; color: var(--ink); margin-top: 8px; line-height: 1.15; }
        #ukraine-who { margin-top: 20px; }
        #ukraine-aim { margin-top: 56px; font-size: 52px; line-height: 1.3; }
      </style>

      <div id="root" data-composition-id="scene-ukraine" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="ukraine-stage" class="stage">
          <div id="ukraine-head" class="section-head"><div id="ukraine-rule" class="section-rule"></div><div id="ukraine-label" class="label">The war in Ukraine</div></div>
          <h1 id="ukraine-hl" class="headline">Grew out of <span class="red">three decades</span> of expansion</h1>
          <div id="ukraine-cols">
            <div id="ukraine-c1" class="panel"><div class="n">1</div><div class="t">Arms</div></div>
            <div id="ukraine-c2" class="panel"><div class="n">2</div><div class="t">Targeting intelligence</div></div>
            <div id="ukraine-c3" class="panel"><div class="n">3</div><div class="t">Long-range drones</div></div>
          </div>
          <div id="ukraine-who" class="byline">Supplied and paid for by the United States and the European powers</div>
          <blockquote id="ukraine-aim" class="quote">A war to <span id="ukraine-wash" class="hl">weaken Russia, subordinate it</span> and open up its vast resources to Western capital</blockquote>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 25.8, "voStart": 0.6, "voEnd": 24.888, "cues": {"decades": 3.07, "arm": 8.6, "intel": 9.83, "drones": 12.71, "aim": 17.25}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("ukraine");
          rise("#ukraine-hl", cue("decades", 1.5) - 0.8, 36, 0.8);
          const a = cue("arm", 5);
          rise("#ukraine-c1", a, 24); fade("#ukraine-who", a + 0.3);
          rise("#ukraine-c2", cue("intel", a + 1.5), 24);
          rise("#ukraine-c3", cue("drones", a + 3), 24);
          const m = cue("aim", 13);
          tl.fromTo("#ukraine-aim", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, m - 0.2);
          wash("#ukraine-wash", m + 0.8);

          tl.to("#ukraine-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-ukraine"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
