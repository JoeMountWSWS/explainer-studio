<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #expansion-map { position: absolute; left: 0; top: 0; width: 1240px; height: 1080px; }
        #expansion-map img { position: absolute; left: 0; top: 0; width: 1240px; height: 1080px; }
        .maplabel { position: absolute; transform: translate(-50%, -50%); font-family: var(--font-sans); font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap; }
        #expansion-kal-l { color: var(--red); font-size: 28px; background: rgba(255,255,255,0.88); padding: 2px 8px; }
        #expansion-ring { position: absolute; left: 647px; top: 445px; width: 120px; height: 120px; border: 5px solid var(--red); border-radius: 50%; }
        #expansion-stage { left: 1300px; right: 100px; display: flex; flex-direction: column; justify-content: center; }
        #expansion-head { width: 100%; }
        #expansion-rows { list-style: none; margin: 28px 0 0; padding: 0; }
        #expansion-rows li { padding: 16px 0; border-top: var(--hairline); }
        #expansion-rows li:first-child { border-top: 0; }
        #expansion-rows .k { font-family: var(--font-sans); font-weight: 700; font-size: 32px; color: var(--red); }
        #expansion-rows .t { font-family: var(--font-sans); font-weight: 600; font-size: 28px; line-height: 1.25; color: var(--ink); margin-top: 4px; }
        #expansion-rows .quiet .k { color: var(--ink-soft); }
        #expansion-rows .quiet .t { color: var(--ink-soft); }
        #expansion-key { display: flex; align-items: center; gap: 14px; margin-top: 20px; }
        #expansion-key .sw { width: 26px; height: 26px; background: #9c9c9c; }
        #expansion-lake { margin-top: 28px; font-size: 40px; color: var(--ink); }
        #expansion-src { margin-top: 28px; font-size: 22px; }
      </style>

      <div id="root" data-composition-id="scene-expansion" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="expansion-map">
          <img id="expansion-base" src="assets/media/maps/europe-base.png" alt="" />
          <img id="expansion-old" src="assets/media/maps/europe-old.png" alt="" />
          <img id="expansion-1999" src="assets/media/maps/europe-1999.png" alt="" />
          <img id="expansion-2004" src="assets/media/maps/europe-2004.png" alt="" />
          <img id="expansion-2009" src="assets/media/maps/europe-2009.png" alt="" />
          <img id="expansion-2023" src="assets/media/maps/europe-2023.png" alt="" />
          <img id="expansion-2024" src="assets/media/maps/europe-2024.png" alt="" />
          <img id="expansion-kal" src="assets/media/maps/europe-kal.png" alt="" />
          <div id="expansion-ring"></div>
          <div id="expansion-kal-l" class="maplabel " style="left: 557px; top: 465px">Kaliningrad</div>
        </div>
        <div id="expansion-stage" class="stage">
          <div id="expansion-head" class="section-head"><div id="expansion-rule" class="section-rule"></div><div id="expansion-label" class="label">NATO moves east</div></div>
          <div id="expansion-key"><span class="sw"></span><span class="byline">Members before 1999</span></div>
          <ul id="expansion-rows">
            <li id="expansion-r1"><div class="k">1999</div><div class="t">Poland, Hungary, Czech Republic</div></li>
            <li id="expansion-r2"><div class="k">2004</div><div class="t">Estonia, Latvia, Lithuania, Romania, Bulgaria, Slovakia, Slovenia</div></li>
            <li id="expansion-r3" class="quiet"><div class="k">2009–2020</div><div class="t">Albania, Croatia, Montenegro, North Macedonia</div></li>
            <li id="expansion-r4"><div class="k">2023</div><div class="t">Finland</div></li>
            <li id="expansion-r5"><div class="k">2024</div><div class="t">Sweden</div></li>
          </ul>
          <p id="expansion-lake" class="standfirst">The Baltic becomes a NATO lake</p>
          <div id="expansion-src" class="byline">Map: Natural Earth. Accession dates: NATO</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 31.0667, "voStart": 0.6, "voEnd": 30.182, "cues": {"w1999": 2.33, "w2004": 6.73, "w2023": 12.92, "w2024": 15.29, "lake": 19.24, "potsdam": 24.3, "island": 27.07}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          fade(["#expansion-base", "#expansion-old", "#expansion-kal"], 0, 0.7);
          head("expansion", 0.2);
          fade("#expansion-key", 0.6);
          const w1 = cue("w1999", 1.5), w2 = cue("w2004", 5);
          fade("#expansion-1999", w1, 0.7); rise("#expansion-r1", w1, 16, 0.5);
          fade("#expansion-2004", w2, 0.7); rise("#expansion-r2", w2, 16, 0.5);
          const w3 = cue("w2023", 11);
          fade("#expansion-2009", w3 - 1.4, 0.7); rise("#expansion-r3", w3 - 1.4, 16, 0.5);
          fade("#expansion-2023", w3, 0.7); rise("#expansion-r4", w3, 16, 0.5);
          const w4 = cue("w2024", 13);
          fade("#expansion-2024", w4, 0.7); rise("#expansion-r5", w4, 16, 0.5);
          rise("#expansion-lake", cue("lake", 15) - 0.2, 16);
          rise("#expansion-kal-l", cue("potsdam", 18) - 1.5, 14);
          const isl = cue("island", 21);
          tl.fromTo("#expansion-ring", { opacity: 0, scale: 2.4 }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, isl - 0.3);
          fade("#expansion-src", w1 + 1);

          tl.to("#expansion-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-expansion"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
