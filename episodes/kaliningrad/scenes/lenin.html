<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #lenin-photo { position: absolute; left: 0; top: 0; bottom: 0; width: 600px; overflow: hidden; }
        #lenin-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; filter: grayscale(1) contrast(1.05); }
        #lenin-credit { position: absolute; left: 32px; right: 32px; bottom: 120px; color: #ffffff; font-size: 22px; background: rgba(20,20,20,0.78); padding: 6px 12px; }
        #lenin-stage { left: 720px; right: 140px; display: flex; flex-direction: column; justify-content: center; }
        #lenin-head { width: 100%; }
        #lenin-hl { font-size: 88px; margin-top: 36px; }
        #lenin-src { margin-top: 28px; }
                #lenin-rows { list-style: none; margin: 40px 0 0; padding: 0; }
                #lenin-rows li { display: flex; gap: 32px; align-items: baseline; padding: 24px 0; border-top: var(--hairline); }
                #lenin-rows li:first-child { border-top: 0; }
                #lenin-rows .k { font-family: var(--font-sans); font-weight: 700; font-size: 32px; letter-spacing: 0.04em; color: var(--red); display: none; flex: none; }
                #lenin-rows .t { font-size: 44px; line-height: 1.28; color: var(--ink); }
      </style>

      <div id="root" data-composition-id="scene-lenin" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="lenin-photo"><img id="lenin-img" data-layout-allow-overflow src="assets/media/lenin.jpg" alt="" /><div id="lenin-credit" class="byline">Lenin in Zurich, 1916. Photo: W. Pleyer. Public domain</div></div>
        <div id="lenin-stage" class="stage">
          <div id="lenin-head" class="section-head"><div id="lenin-rule" class="section-rule"></div><div id="lenin-label" class="label">Lenin, 1916</div></div>
          <h1 id="lenin-hl" class="headline">Capitalism’s <span id="lenin-wash" class="hl">imperialist stage</span></h1>
          <ul id="lenin-rows">
            <li id="lenin-r1"><span class="body t">Giant <strong>monopolies and banks</strong>, fused with their states,</span></li>
            <li id="lenin-r2"><span class="body t">compete to <strong>divide and redivide</strong> the world’s markets, raw materials and territory</span></li>
          </ul>
          <div id="lenin-src" class="byline">V. I. Lenin, <span class="italic">Imperialism, the Highest Stage of Capitalism</span>, 1916</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 22.9, "voStart": 0.6, "voEnd": 22.009, "cues": {"lenin": 5.6, "imperialist": 9.08, "monopolies": 11.64, "divide": 16.23}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          fade("#lenin-photo", 0, 0.6);
          tl.fromTo("#lenin-img", { scale: 1.06 }, { scale: 1, duration: T.duration, ease: "none" }, 0);
          head("lenin", 0.3);
          const l = cue("lenin", 4);
          rise("#lenin-hl", l, 30, 0.8);
          fade("#lenin-src", l + 0.6);
          wash("#lenin-wash", cue("imperialist", l + 2.5));
          rise("#lenin-r1", cue("monopolies", 9) - 0.4, 20);
          rise("#lenin-r2", cue("divide", 13) - 0.6, 20);

          tl.to("#lenin-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-lenin"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
