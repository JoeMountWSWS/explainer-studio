<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #leaders-stage { display: flex; flex-direction: column; }
        #leaders-head { width: 100%; }
        #leaders-row { display: flex; gap: 48px; margin-top: 40px; }
        #leaders-row .person { width: 480px; }
        #leaders-row .ph { position: relative; width: 480px; height: 400px; overflow: hidden; }
        #leaders-row .ph img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
        #leaders-row .cr { position: absolute; left: 0; right: 0; bottom: 0; color: #ffffff; font-size: 18px; background: rgba(20,20,20,0.78); padding: 4px 10px; }
        #leaders-row .nm { margin-top: 22px; }
        #leaders-row .role { font-size: 24px; margin-top: 4px; }
        #leaders-row .q { font-size: 42px; line-height: 1.25; color: var(--ink); margin-top: 18px; border-left: 6px solid var(--red); padding-left: 24px; font-weight: 700; }
        #leaders-kyiv { margin-top: 18px; font-size: 30px; line-height: 1.3; color: var(--ink-soft); font-family: var(--font-sans); font-weight: 600; }
        #leaders-kyiv .red { font-weight: 700; }
      </style>

      <div id="root" data-composition-id="scene-leaders" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="leaders-stage" class="stage">
          <div id="leaders-head" class="section-head"><div id="leaders-rule" class="section-rule"></div><div id="leaders-label" class="label">The response</div></div>
          <div id="leaders-row">
            <div id="leaders-p1" class="person">
            <div class="ph"><img src="assets/media/rutte.jpg" alt="" style="object-position: 50% 0%" /><div class="cr byline">Photo: US Department of Defense, public domain</div></div>
            <div class="nm label">Mark Rutte</div><div class="role byline">NATO Secretary General, Brussels</div>
            <p id="leaders-q1" class="body q">“I don’t take this seriously.”</p>
          </div>
            <div id="leaders-p2" class="person">
            <div class="ph"><img src="assets/media/merz.jpg" alt="" style="object-position: 50% 25%" /><div class="cr byline">Photo: Finnish Government, CC BY 2.0</div></div>
            <div class="nm label">Friedrich Merz</div><div class="role byline">German Chancellor</div>
            <p id="leaders-q2" class="body q">“With all our strength.”</p>
            <div id="leaders-kyiv">4 Oct, Kyiv, with arms makers: joint weapons with a range of <span id="leaders-range" class="red">1,000+ km</span></div>
          </div>
            <div id="leaders-p3" class="person">
            <div class="ph"><img src="assets/media/kubilius.jpg" alt="" style="object-position: 50% 0%" /><div class="cr byline">Photo: Lukasz Kobus / European Union, CC BY 4.0</div></div>
            <div class="nm label">Andrius Kubilius</div><div class="role byline">EU defence commissioner</div>
            <p id="leaders-q3" class="body q">“Feel that war is coming to Russia itself.”</p>
          </div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 33.6, "voStart": 0.6, "voEnd": 32.689, "cues": {"rutte": 4.72, "merz": 10.68, "kyiv": 14.46, "range": 22.63, "kubilius": 30.29}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("leaders");
          tl.set(["#leaders-q1", "#leaders-q2", "#leaders-q3"], { opacity: 0 }, 0);
          const r = cue("rutte", 3);
          rise("#leaders-p1", r - 2.4, 24);
          fade("#leaders-q1", r, 0.5);
          const m = cue("merz", 8);
          rise("#leaders-p2", m - 2.6, 24);
          fade("#leaders-q2", m, 0.5);
          rise("#leaders-kyiv", cue("kyiv", m + 3) - 0.3, 14);
          tl.fromTo("#leaders-range", { color: "#555555" }, { color: "#e71e25", duration: 0.4 }, cue("range", m + 7));
          const k = cue("kubilius", 20);
          rise("#leaders-p3", k - 3, 24);
          fade("#leaders-q3", k, 0.5);

          tl.to("#leaders-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-leaders"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
