<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #silence-stage { display: flex; flex-direction: column; justify-content: center; }
        #silence-hl { font-size: 150px; }
        #silence-sub { margin-top: 48px; max-width: 1400px; font-size: 52px; }
        #silence-now { margin-top: 48px; font-size: 96px; color: var(--red); }
      </style>

      <div id="root" data-composition-id="scene-silence" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="silence-stage" class="stage">
          <div id="silence-tag" class="tag">The first task</div>
          <h1 id="silence-hl" class="headline" style="margin-top: 28px">Break the silence.</h1>
          <p id="silence-sub" class="standfirst">Millions cannot believe their governments would gamble with nuclear war.</p>
          <h2 id="silence-now" class="headline">They are gambling with it now.</h2>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 13.5333, "voStart": 0.6, "voEnd": 12.628, "cues": {"break": 2.01, "gamble": 8.38, "now": 10.44}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          rise("#silence-tag", 0.2, 16, 0.5);
          rise("#silence-hl", cue("break", 1) - 0.2, 40, 0.8);
          rise("#silence-sub", cue("gamble", 6) - 2.5, 20);
          rise("#silence-now", cue("now", 9) - 0.1, 30, 0.7);

          tl.to("#silence-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-silence"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
