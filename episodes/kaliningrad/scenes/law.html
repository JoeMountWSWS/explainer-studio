<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #law-stage { display: flex; flex-direction: column; justify-content: center; }
        #law-head { width: 100%; }
        #law-hl { font-size: 92px; margin-top: 40px; }
        #law-docs { display: flex; gap: 40px; margin-top: 52px; }
        #law-docs .panel { flex: 1; padding: 36px 44px; }
        #law-docs .k { font-family: var(--font-sans); font-weight: 700; font-size: 26px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
        #law-docs .t { font-size: 44px; line-height: 1.32; color: var(--ink); margin-top: 18px; }
        #law-kal { margin-top: 24px; background: var(--red); }
      </style>

      <div id="root" data-composition-id="scene-law" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="law-stage" class="stage">
          <div id="law-head" class="section-head"><div id="law-rule" class="section-rule"></div><div id="law-label" class="label">International law</div></div>
          <h1 id="law-hl" class="headline">A blockade is <span id="law-wash" class="hl">an act of war</span></h1>
          <div id="law-docs">
            <div id="law-d1" class="panel"><div class="k">UN General Assembly Resolution 3314, 1974 · Definition of aggression</div><p class="body t">Art. 3(c): “The blockade of the ports or coasts of a State by the armed forces of another State”</p></div>
            <div id="law-d2" class="panel"><div class="k">Russian nuclear doctrine · Revised November 2024</div><p class="body t">Permits a nuclear response to a conventional attack that critically threatens its territory</p><div id="law-kal" class="tag">Written with Kaliningrad in mind</div></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 29.1333, "voStart": 0.6, "voEnd": 28.244, "cues": {"act": 3.56, "un": 7.47, "listed": 9.68, "doctrine": 14.84, "conventional": 19.58, "kal": 26.36}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("law");
          rise("#law-hl", 0.4, 36, 0.8);
          wash("#law-wash", cue("act", 2));
          rise("#law-d1", cue("un", 5) - 0.6, 24);
          rise("#law-d2", cue("doctrine", 13) - 0.2, 24);
          rise("#law-kal", cue("kal", 22) - 0.3, 12, 0.5);

          tl.to("#law-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-law"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
