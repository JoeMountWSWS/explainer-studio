<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #promise-stage { display: flex; flex-direction: column; justify-content: center; }
        #promise-head { width: 100%; }
        #promise-list { list-style: none; margin: 40px 0 0; padding: 0; }
        #promise-list li { display: flex; gap: 40px; align-items: baseline; padding: 30px 0; border-top: var(--hairline); }
        #promise-list li:first-child { border-top: 0; }
        #promise-list .n { font-family: var(--font-sans); font-weight: 700; font-size: 56px; color: var(--red); width: 60px; }
        #promise-list .t { font-size: 84px; }
      </style>

      <div id="root" data-composition-id="scene-promise" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="promise-stage" class="stage">
          <div id="promise-head" class="section-head"><div id="promise-rule" class="section-rule"></div><div id="promise-label" class="label">This video</div></div>
          <ol id="promise-list">
            <li id="promise-l1"><span class="n">1</span><span class="headline t">How we got here</span></li>
            <li id="promise-l2"><span class="n">2</span><span class="headline t">Why the danger keeps growing</span></li>
            <li id="promise-l3"><span class="n">3</span><span class="headline t">What can stop it</span></li>
          </ol>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 8.7, "voStart": 0.6, "voEnd": 7.798, "cues": {"how": 2.41, "why": 3.86, "stop": 5.95}, "paragraphs": [0.6]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("promise");
          rise("#promise-l1", cue("how", 1), 30);
          rise("#promise-l2", cue("why", 2.2), 30);
          rise("#promise-l3", cue("stop", 3.8), 30);

          tl.to("#promise-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-promise"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
