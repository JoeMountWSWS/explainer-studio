<!doctype html>
<!-- YouTube thumbnail, 1280x720. `studio thumbnail <slug>` screenshots this page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../assets/brand/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #ffffff; }
      .map { position: absolute; top: 0; right: 0; bottom: 0; width: 520px; overflow: hidden; }
      .map img { position: absolute; left: -111px; top: 0; width: 733px; height: 720px; }
      .kal { position: absolute; left: 160px; top: 368px; font-family: var(--font-sans); font-weight: 700; font-size: 26px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); background: rgba(255,255,255,0.9); padding: 2px 8px; }
      .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 28px; background: var(--red); }
      .frame { position: absolute; top: 0; bottom: 0; left: 0; width: 760px; padding: 72px 40px 72px 88px; display: flex; flex-direction: column; justify-content: center; }
      .tag { font-size: 30px; padding: 12px 22px 11px; }
      h1 { font-family: var(--font-serif); font-weight: 700; font-size: 108px; line-height: 1.02; color: var(--ink); margin-top: 32px; }
      h1 .red { color: var(--red); }
      .rule { height: 8px; background: var(--ink); width: 240px; margin-top: 40px; }
    </style>
  </head>
  <body>
    <div class="map">
      <img src="../assets/media/maps/baltic-base.png" alt="" />
      <img src="../assets/media/maps/baltic-nato.png" alt="" />
      <img src="../assets/media/maps/baltic-kal.png" alt="" />
      <div class="kal">Kaliningrad</div>
    </div>
    <div class="bar"></div>
    <div class="frame">
      <div class="tag">Kaliningrad</div>
      <h1>On the brink of <span class="red">nuclear war?</span></h1>
      <div class="rule"></div>
    </div>
  </body>
</html>
