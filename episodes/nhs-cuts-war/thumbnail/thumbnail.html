<!doctype html>
<!-- YouTube thumbnail, 1280x720. `studio thumbnail <slug>` screenshots this page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../assets/brand/brand.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1280px; height: 720px; overflow: hidden; background: #ffffff; }
      .photo { position: absolute; top: 0; right: 0; bottom: 0; width: 470px; background: url("../assets/media/medway.jpg") 38% 50% / cover; }
      .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 28px; background: var(--red); }
      .frame { position: absolute; top: 0; bottom: 0; left: 0; width: 810px; padding: 72px 40px 72px 88px; display: flex; flex-direction: column; justify-content: center; }
      .tag { font-size: 30px; padding: 12px 22px 11px; }
      h1 { font-family: var(--font-serif); font-weight: 700; font-size: 116px; line-height: 1.02; color: var(--ink); margin-top: 32px; }
      h1 .red { color: var(--red); }
      .rule { height: 8px; background: var(--ink); width: 240px; margin-top: 40px; }
    </style>
  </head>
  <body>
    <div class="photo"></div>
    <div class="bar"></div>
    <div class="frame">
      <div class="tag">NHS cuts</div>
      <h1>Hospitals cut to pay for <span class="red">war</span></h1>
      <div class="rule"></div>
    </div>
  </body>
</html>
