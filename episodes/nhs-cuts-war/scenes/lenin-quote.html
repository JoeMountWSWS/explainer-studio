<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #lenin-quote-stage { display: flex; flex-direction: column; justify-content: center; }
        #lenin-quote-quote { font-size: 54px; line-height: 1.35; max-width: 1500px; }
        #lenin-quote-who { margin-top: 48px; padding-left: 62px; }
        #lenin-quote-src { margin-top: 12px; padding-left: 62px; }
      </style>

      <div id="root" data-composition-id="scene-lenin-quote" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="lenin-quote-stage" class="stage">
          <blockquote id="lenin-quote-quote" class="quote">“Imperialism is capitalism at that stage of development at which the dominance of monopolies and finance capital is established; … <span id="lenin-quote-wash" class="hl">in which the division of all territories of the globe among the biggest capitalist powers has been completed</span>.”</blockquote>
          <div id="lenin-quote-who" class="label">V. I. Lenin</div>
          <div id="lenin-quote-src" class="byline"><span class="italic">Imperialism, the Highest Stage of Capitalism</span>, Chapter VII, 1916</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 11.0667, "voStart": 0.4, "voEnd": 10.363, "cues": {"key": 3.86}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          tl.fromTo("#lenin-quote-quote", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.25);
          fade(["#lenin-quote-who", "#lenin-quote-src"], 1.0);
          wash("#lenin-quote-wash", cue("key", 3));

          tl.to("#lenin-quote-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-lenin-quote"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
