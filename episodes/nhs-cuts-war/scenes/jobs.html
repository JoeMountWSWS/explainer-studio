<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #jobs-stage { display: flex; flex-direction: column; }
        #jobs-head { width: 640px; }
        #jobs-main { display: flex; gap: 100px; margin-top: 60px; }
        #jobs-left { width: 640px; }
        #jobs-n { font-family: var(--font-serif); font-weight: 700; font-size: 190px; line-height: 1; color: var(--red); font-variant-numeric: lining-nums tabular-nums; }
        #jobs-what { font-size: 44px; margin-top: 16px; }
        #jobs-chart { flex: 1; display: flex; flex-direction: column; gap: 34px; padding-top: 10px; }
        #jobs-chart .lab { font-family: var(--font-sans); font-weight: 700; font-size: 30px; color: var(--ink); display: flex; justify-content: space-between; margin-bottom: 10px; }
        #jobs-chart .bar { height: 44px; background: var(--ink); transform-origin: left center; }
        #jobs-wait { margin-top: 60px; font-size: 48px; color: var(--ink); padding-top: 28px; border-top: var(--hairline); }
        #jobs-src { position: absolute; left: 0; bottom: 0; }
      </style>

      <div id="root" data-composition-id="scene-jobs" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="jobs-stage" class="stage">
          <div id="jobs-head" class="section-head"><div id="jobs-rule" class="section-rule"></div><div id="jobs-label" class="label">NHS posts to be cut by 2028</div></div>
          <div id="jobs-main">
            <div id="jobs-left">
              <div id="jobs-n">0</div>
              <p id="jobs-what" class="standfirst">posts across England, at least. Possibly 30,000.</p>
            </div>
            <div id="jobs-chart">
              <div id="jobs-c1"><div class="lab"><span>South East</span><span>5,152</span></div><div class="bar" style="width: 100%"></div></div>
              <div id="jobs-c2"><div class="lab"><span>London</span><span>4,232</span></div><div class="bar" style="width: 82.1%"></div></div>
              <div id="jobs-c3"><div class="lab"><span>North West</span><span>3,701</span></div><div class="bar" style="width: 71.8%"></div></div>
            </div>
          </div>
          <p id="jobs-wait" class="body">Waiting list: <b>7.33 million</b></p>
          <div id="jobs-src" class="byline">Source: UNISON analysis of trust plans, via WSWS, 12 Oct 2026. Waiting list: July 2026.</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 16.3333, "voStart": 0.4, "voEnd": 15.632, "cues": {"total": 5.62, "wait": 13.81}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("jobs");
          ["#jobs-c1", "#jobs-c2", "#jobs-c3"].forEach((s, i) => { fade(s, 0.8 + i * 0.15, 0.4); grow(`${s} .bar`, 0.8 + i * 0.15, 1.0); });
          const t = cue("total", 6);
          rise("#jobs-n", t, 30);
          count("#jobs-n", 21663, t, (v) => Math.round(v).toLocaleString("en-GB"), 1.4);
          rise("#jobs-what", t + 0.9, 20);
          rise("#jobs-wait", cue("wait", 12), 20);
          fade("#jobs-src", t + 1.2);

          tl.to("#jobs-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-jobs"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
