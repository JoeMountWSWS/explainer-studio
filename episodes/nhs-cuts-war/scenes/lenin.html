<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #lenin-photo { position: absolute; top: 0; right: 0; bottom: 0; width: 760px; overflow: hidden; }
        #lenin-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; filter: grayscale(1); }
        #lenin-credit { position: absolute; left: 32px; bottom: 120px; color: #ffffff; font-size: 22px; background: rgba(20,20,20,0.78); padding: 6px 12px; }
        #lenin-stage { right: 880px; display: flex; flex-direction: column; justify-content: center; }
        #lenin-name { font-size: 96px; margin-top: 32px; }
        #lenin-book { margin-top: 48px; padding-top: 36px; border-top: var(--hairline); }
        #lenin-title { font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 64px; line-height: 1.15; color: var(--ink); }
        #lenin-date { margin-top: 18px; }
        #lenin-divided { margin-top: 48px; font-size: 46px; }
      </style>

      <div id="root" data-composition-id="scene-lenin" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="lenin-photo"><img id="lenin-img" data-layout-allow-overflow src="assets/media/lenin.jpg" alt="" /><div id="lenin-credit" class="byline">Lenin in Zurich, 1916. Photo: W. Pleyer. Public domain</div></div>
        <div id="lenin-stage" class="stage">
          <div id="lenin-tag" class="tag">History</div>
          <h2 id="lenin-name" class="headline">V. I. Lenin</h2>
          <div id="lenin-book">
            <div id="lenin-title">Imperialism, the Highest Stage of Capitalism</div>
            <div id="lenin-date" class="label">Zurich, 1916</div>
          </div>
          <p id="lenin-divided" class="standfirst">The world already <span id="lenin-wash" class="hl" style="color: var(--ink)">divided up</span> among a handful of great powers.</p>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 19.0667, "voStart": 0.4, "voEnd": 18.363, "cues": {"book": 4.72, "divided": 14.55}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          fade("#lenin-photo", 0, 0.6);
          tl.fromTo("#lenin-img", { scale: 1.06 }, { scale: 1, duration: T.duration, ease: "none" }, 0);
          rise("#lenin-tag", 0.3, 16, 0.5);
          rise("#lenin-name", 0.5, 40);
          rise("#lenin-book", cue("book", 3.5), 30);
          const d = cue("divided", 13);
          rise("#lenin-divided", d, 20);
          wash("#lenin-wash", d + 1.2);

          tl.to("#lenin-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-lenin"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
