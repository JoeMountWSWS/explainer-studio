<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #hook-photo { position: absolute; top: 0; right: 0; bottom: 0; width: 900px; overflow: hidden; }
        #hook-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 40% 50%; }
        #hook-credit { position: absolute; left: 32px; bottom: 120px; color: #ffffff; font-size: 22px; background: rgba(20,20,20,0.78); padding: 6px 12px; }
        #hook-stage { right: 1020px; display: flex; flex-direction: column; justify-content: center; }
        #hook-title { font-size: 84px; margin-top: 32px; }
        #hook-place { margin-top: 28px; font-size: 40px; }
        #hook-figs { position: absolute; left: 0; right: 0; top: 50%; margin-top: -330px; }
        #hook-figs .fig { font-family: var(--font-serif); font-weight: 700; font-size: 150px; line-height: 1; font-variant-numeric: lining-nums; }
        #hook-figs .what { font-size: 40px; margin-top: 10px; }
        #hook-f2 { margin-top: 56px; }
        #hook-src { position: absolute; left: 0; bottom: 0; font-size: 24px; }
      </style>

      <div id="root" data-composition-id="scene-hook" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="hook-photo"><img id="hook-img" data-layout-allow-overflow src="assets/media/medway.jpg" alt="" /><div id="hook-credit" class="byline">Medway Maritime Hospital, Gillingham, Kent. Photo: David Anstiss, CC BY-SA 2.0</div></div>
        <div id="hook-stage" class="stage">
          <div id="hook-intro">
            <div id="hook-tag" class="tag">Explainer</div>
            <h1 id="hook-title" class="headline">Why is the NHS being cut to pay for war?</h1>
            <p id="hook-place" class="standfirst">Medway Maritime Hospital, Kent</p>
          </div>
          <div id="hook-figs">
            <div id="hook-f1"><div id="hook-n1" class="fig red">0</div><p class="standfirst what">posts to be cut over five years: almost one in seven staff</p></div>
            <div id="hook-f2"><div class="fig" style="color: var(--ink)">£143.8m</div><p class="standfirst what">in savings: 26% of the hospital’s costs</p></div>
          </div>
          <div id="hook-src" class="byline">Source: Medway NHS Foundation Trust board papers, via HSJ and WSWS, 12 Oct 2026</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 18.6, "voStart": 0.4, "voEnd": 17.915, "cues": {"posts": 8.24, "savings": 14.77}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          tl.fromTo("#hook-img", { scale: 1.08 }, { scale: 1, duration: T.duration, ease: "none" }, 0);
          fade("#hook-photo", 0, 0.4);
          rise("#hook-tag", 0.2, 16, 0.5);
          rise("#hook-title", 0.35, 40, 0.9);
          rise("#hook-place", 1.2, 20);
          const p = cue("posts", 7);
          out("#hook-intro", p - 0.6, 0.45);
          rise("#hook-f1", p, 30);
          count("#hook-n1", 861, p, (v) => Math.round(v).toLocaleString("en-GB"), 1.2);
          rise("#hook-f2", cue("savings", 13), 30);
          fade("#hook-src", cue("savings", 13) + 0.8);

          tl.to("#hook-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
