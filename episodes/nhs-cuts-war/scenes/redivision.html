<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #redivision-stage { display: flex; flex-direction: column; }
        #redivision-head { width: 640px; }
        #redivision-line { font-size: 80px; margin-top: 36px; }
        #redivision-mapbox { position: absolute; left: 110px; right: 110px; bottom: 30px; height: 660px; }
        #redivision-mapbox img { position: absolute; left: 0; top: 0; width: 100%; }
        #redivision-keys { position: absolute; left: 0; top: 230px; display: flex; gap: 40px; }
        #redivision-keys .k { display: flex; align-items: center; gap: 14px; }
        #redivision-keys .sw { width: 28px; height: 28px; }
      </style>

      <div id="root" data-composition-id="scene-redivision" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="redivision-mapbox">
          <img src="assets/media/maps/world-base.png" alt="" />
          <img id="redivision-us" src="assets/media/maps/world-us-ink.png" alt="" />
          <img id="redivision-ir" src="assets/media/maps/world-ir.png" alt="" />
          <img id="redivision-ua" src="assets/media/maps/world-ua.png" alt="" />
          <img id="redivision-cn" src="assets/media/maps/world-cn.png" alt="" />
          <img id="redivision-eu" src="assets/media/maps/world-eu.png" alt="" />
        </div>
        <div id="redivision-stage" class="stage">
          <div id="redivision-head" class="section-head"><div id="redivision-rule" class="section-rule"></div><div id="redivision-label" class="label">A new redivision of the world</div></div>
          <h2 id="redivision-line" class="headline">War becomes the means of <span class="red">redividing</span> it.</h2>
          <div id="redivision-keys">
            <div class="k" id="redivision-k1"><div class="sw" style="background: var(--ink)"></div><span class="label">US and European powers</span></div>
            <div class="k" id="redivision-k2"><div class="sw" style="background: var(--red)"></div><span class="label">Targets: Iran, Ukraine, China</span></div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 20.8, "voStart": 0.4, "voEnd": 20.091, "cues": {"war": 4.94, "now": 7.48, "iran": 14.28, "ukraine": 14.79, "china": 16.25, "europe": 17.02}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("redivision");
          fade("#redivision-mapbox > img:first-child", 0.3, 0.8);
          rise("#redivision-line", cue("war", 4), 30);
          const n = cue("now", 7);
          out("#redivision-line", n - 0.5);
          fade("#redivision-us", n);
          fade("#redivision-k1", n);
          fade("#redivision-ir", cue("iran", 12));
          fade("#redivision-k2", cue("iran", 12));
          fade("#redivision-ua", cue("ukraine", 13));
          fade("#redivision-cn", cue("china", 14));
          fade("#redivision-eu", cue("europe", 15));

          tl.to("#redivision-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-redivision"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
