<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #nukes-stage { display: flex; flex-direction: column; }
        #nukes-head { width: 640px; }
        #nukes-rows { margin-top: 70px; display: flex; flex-direction: column; gap: 56px; }
        #nukes-rows .row-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 18px; }
        #nukes-rows .what { font-size: 44px; color: var(--ink); }
        #nukes-rows .amt { font-family: var(--font-serif); font-weight: 700; font-size: 72px; color: var(--ink); }
        #nukes-rows .bar { height: 56px; transform-origin: left center; }
        #nukes-bar1 { background: var(--red); width: 100%; }
        #nukes-bar2 { background: var(--ink); width: 6px; }
        #nukes-amt1 { color: var(--red) !important; }
        #nukes-days { margin-top: 70px; font-size: 76px; max-width: 1500px; }
        #nukes-src { position: absolute; left: 0; bottom: 0; }
      </style>

      <div id="root" data-composition-id="scene-nukes" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="nukes-stage" class="stage">
          <div id="nukes-head" class="section-head"><div id="nukes-rule" class="section-rule"></div><div id="nukes-label" class="label">Defence Investment Plan, June 2026</div></div>
          <div id="nukes-rows">
            <div id="nukes-r1"><div class="row-label"><span class="body what">Nuclear weapons, four years</span><span id="nukes-amt1" class="amt">£63bn+</span></div><div id="nukes-bar1" class="bar"></div></div>
            <div id="nukes-r2"><div class="row-label"><span class="body what">Medway’s savings target, five years</span><span class="amt">£143.8m</span></div><div id="nukes-bar2" class="bar"></div></div>
          </div>
          <h2 id="nukes-days" class="headline">Less than <span class="red">four days</span> of nuclear spending.</h2>
          <div id="nukes-src" class="byline">Sources: Defence Investment Plan, 30 June 2026; WSWS, 3 July and 12 Oct 2026. £63bn ÷ 4 years ≈ £43m a day.</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 18.2333, "voStart": 0.4, "voEnd": 17.531, "cues": {"nukes": 4.8, "days": 14.68}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          head("nukes");
          const n = cue("nukes", 4);
          fade("#nukes-r2", 0.6);
          grow("#nukes-bar2", 0.9, 0.4);
          fade("#nukes-r1", n);
          grow("#nukes-bar1", n + 0.2, 1.6);
          rise("#nukes-days", cue("days", 13), 30);
          fade("#nukes-src", cue("days", 13) + 0.8);

          tl.to("#nukes-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-nukes"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
