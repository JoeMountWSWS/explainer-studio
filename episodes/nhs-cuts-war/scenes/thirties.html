<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #thirties-photo { position: absolute; left: 0; top: 0; bottom: 0; width: 820px; overflow: hidden; }
        #thirties-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 45% 50%; filter: grayscale(1); }
        #thirties-credit { position: absolute; left: 32px; right: 32px; bottom: 120px; color: #ffffff; font-size: 22px; background: rgba(20,20,20,0.78); padding: 6px 12px; }
        #thirties-stage { left: 920px; right: 130px; display: flex; flex-direction: column; justify-content: center; }
        #thirties-head { width: 100%; }
        #thirties-list { list-style: none; margin: 36px 0 0; padding: 0; }
        #thirties-list li { display: flex; gap: 28px; align-items: baseline; padding: 22px 0; border-top: var(--hairline); }
        #thirties-list li:first-child { border-top: 0; }
        #thirties-list .yr { font-family: var(--font-sans); font-weight: 700; font-size: 32px; color: var(--red); min-width: 92px; }
        #thirties-list .t { font-size: 44px; line-height: 1.25; color: var(--ink); }
        #thirties-war .t { font-weight: 700; }
      </style>

      <div id="root" data-composition-id="scene-thirties" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="thirties-photo"><img id="thirties-img" data-layout-allow-overflow src="assets/media/jarrow.jpg" alt="" /><div id="thirties-credit" class="byline">Jarrow marchers on the road to London, October 1936. National Media Museum, no known copyright restrictions</div></div>
        <div id="thirties-stage" class="stage">
          <div id="thirties-head" class="section-head"><div id="thirties-rule" class="section-rule"></div><div id="thirties-label" class="label">This has happened before</div></div>
          <ul id="thirties-list">
            <li id="thirties-l1"><span class="yr">1931</span><span class="body t">Labour’s MacDonald joins the Tories: benefit cut 10%, the means test</span></li>
            <li id="thirties-l3"><span class="yr">1933</span><span class="body t">Germany: unions destroyed. Guns before butter.</span></li>
            <li id="thirties-l2"><span class="yr">1937</span><span class="body t">Britain borrows hundreds of millions for rearmament</span></li>
            <li id="thirties-war"><span class="yr">1939</span><span class="body t">The Second World War</span></li>
          </ul>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 25.1667, "voStart": 0.4, "voEnd": 24.464, "cues": {"cut": 6.69, "means": 10.74, "nazi": 11.55, "guns": 15.24, "rearm": 19.99, "ww2": 22.23}, "paragraphs": [0.4]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.7) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);
          const fade = (s, t, d = 0.6) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const out = (s, t, d = 0.4) => tl.to(s, { opacity: 0, duration: d, ease: "power2.in" }, t);
          const grow = (s, t, d = 0.9) => tl.fromTo(s, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "power2.inOut" }, t);
          const wash = (s, t) => tl.fromTo(s, { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power2.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };
          const head = (id, t = 0.1) => { grow(`#${id}-rule`, t, 0.7); fade(`#${id}-label`, t + 0.3, 0.5); };

          fade("#thirties-photo", 0, 0.6);
          tl.fromTo("#thirties-img", { scale: 1.07 }, { scale: 1, duration: T.duration, ease: "none" }, 0);
          head("thirties", 0.3);
          rise("#thirties-l1", cue("cut", 5) - 0.3, 20);
          rise("#thirties-l3", cue("nazi", 13), 20);
          rise("#thirties-l2", cue("rearm", 17), 20);
          rise("#thirties-war", cue("ww2", 21), 20);

          tl.to("#thirties-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-thirties"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
