<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #outro-band { position: absolute; left: 0; right: 0; top: 1190px; bottom: 0; background: var(--tag); }
        #outro-stage { display: flex; flex-direction: column; }
        #outro-head { width: 100%; }
        #outro-head .label { font-size: 30px; }
        #outro-article { margin-top: 30px; }
        #outro-article .headline { font-size: 64px; line-height: 1.14; }
        #outro-article .byline { margin-top: 16px; font-size: 28px; }
        #outro-join { margin-top: 64px; padding-top: 30px; border-top: 6px solid var(--ink); }
        #outro-join .kicker { font-family: var(--font-sans); font-weight: 700; font-size: 40px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink); }
        #outro-join .party { font-family: var(--font-serif); font-weight: 700; font-size: 96px; line-height: 1.04; color: var(--red); margin-top: 10px; }
        #outro-join .en { font-family: var(--font-serif); font-style: italic; font-size: 40px; color: var(--ink-soft); margin-top: 12px; }
        #outro-url { margin-top: 44px; font-family: var(--font-sans); font-weight: 700; font-size: 84px; color: var(--ink); }
        #outro-url .dot { color: var(--red); }
      </style>

      <div id="root" data-composition-id="scene-outro" data-width="1080" data-height="1920">
        <div class="paper"></div>
        <div id="outro-band"></div>
        <div id="outro-stage" class="stage-reel">
          <div id="outro-head" class="section-head"><div id="outro-rule" class="section-rule"></div><div id="outro-label" class="label">World Socialist Web Site</div></div>
          <div id="outro-article">
            <h1 class="headline">After mass October 17 protest, French government prepares dictatorship</h1>
            <div class="byline">Alex Lantier · 19 October 2026</div>
          </div>
          <div id="outro-join">
            <div class="kicker">Join the</div>
            <div class="party">Socialist Equality Party</div>
            <div class="en">Parti de l'égalité socialiste</div>
          </div>
          <div id="outro-url">wsws<span class="dot">.</span>org</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 5.2, "voStart": 0.15, "voEnd": 4.748, "cues": {"join": 0.25, "read": 2.35}, "paragraphs": [0.15]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.45) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);

          tl.fromTo("#outro-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0);
          tl.fromTo("#outro-label", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
          rise("#outro-article", 0.1, 20, 0.35);
          rise("#outro-join", cue("join", 0.2) + 0.1, 40);
          rise("#outro-url", cue("read", 2.8), 30);

          // No exit fade: the reel ends (and loops) on this frame.
          window.__timelines["scene-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
