<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--tag); }
        .crackdown-bg { position: absolute; inset: 0; overflow: hidden; }
        .crackdown-bg img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.2) brightness(0.95); }
        #crackdown-police, #crackdown-gas { bottom: 680px; }
        #crackdown-police img { object-position: 30% 50%; }
        #crackdown-gas img { object-position: 45% 50%; }
        #crackdown-shade { position: absolute; inset: 0;
          background: linear-gradient(to bottom, rgba(27,33,41,0.93) 0%, rgba(27,33,41,0.9) 30%, rgba(27,33,41,0.8) 45%, rgba(27,33,41,0.78) 55%, rgba(27,33,41,0.96) 72%, rgba(27,33,41,0.96) 100%); }
        #crackdown-stage { display: flex; flex-direction: column; }
        #crackdown-head { width: 520px; }
        #crackdown-head .section-rule { background: #ffffff; }
        #crackdown-head .label { color: #ffffff; font-size: 30px; }
        #crackdown-num { font-family: var(--font-serif); font-weight: 700; font-size: 200px; line-height: 1; color: var(--red); margin-top: 40px; }
        #crackdown-arrested { font-family: var(--font-sans); font-weight: 700; font-size: 64px; letter-spacing: 0.12em; color: #ffffff; margin-top: 6px; }
        .crackdown-stamp { font-family: var(--font-sans); font-weight: 700; font-size: 72px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff; border-top: 4px solid rgba(255,255,255,0.35); padding-top: 18px; margin-top: 26px; }
        #crackdown-soe .q { color: #ffffff; }
        #crackdown-card { position: absolute; left: 72px; right: 72px; top: 1000px; display: flex; gap: 28px; align-items: flex-start; }
        #crackdown-face { width: 140px; height: 170px; flex: none; overflow: hidden; }
        #crackdown-face img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; filter: grayscale(1); }
        #crackdown-quote { font-family: var(--font-serif); font-style: italic; font-size: 50px; line-height: 1.2; color: #ffffff; border-left: 6px solid var(--red); padding-left: 26px; }
        #crackdown-quote .byline { display: block; font-style: normal; font-size: 26px; color: rgba(255,255,255,0.8); margin-top: 10px; }
        .crackdown-credit { position: absolute; right: 72px; top: 1182px; font-size: 22px; color: rgba(255,255,255,0.75); }
      </style>

      <div id="root" data-composition-id="scene-crackdown" data-width="1080" data-height="1920">
        <div id="crackdown-police" class="crackdown-bg"><img id="crackdown-police-img" data-layout-allow-overflow src="assets/media/police.jpg" alt="" /></div>
        <div id="crackdown-gas" class="crackdown-bg"><img id="crackdown-gas-img" data-layout-allow-overflow src="assets/media/gazer.jpg" alt="" /></div>
        <div id="crackdown-shade"></div>

        <div id="crackdown-stage" class="stage-reel">
          <div id="crackdown-head" class="section-head"><div id="crackdown-rule" class="section-rule"></div><div id="crackdown-label" class="label">The government's answer</div></div>
          <div id="crackdown-num">2,400</div>
          <div id="crackdown-arrested">ARRESTED</div>
          <div id="crackdown-curfew" class="crackdown-stamp">Curfews</div>
          <div id="crackdown-soe" class="crackdown-stamp">State of emergency<span class="q">?</span></div>
        </div>

        <div id="crackdown-card">
          <div id="crackdown-face"><img src="assets/media/lecornu.jpg" alt="" /></div>
          <div id="crackdown-quote">“If necessary, clearly we could.”<span class="byline">PM Sébastien Lecornu, on a state of emergency</span></div>
        </div>

        <div id="crackdown-c1" class="crackdown-credit byline" data-layout-allow-overlap>Paris, 17 Oct 2026. Photo: Silanoc / CC BY-SA 4.0. Lecornu: P. Normand / CC BY-SA 4.0</div>
        <div id="crackdown-c2" class="crackdown-credit byline" data-layout-allow-overlap>Paris, 17 Oct 2026. Photo: FreCha / CC BY-SA 4.0. Lecornu: P. Normand / CC BY-SA 4.0</div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 7.7, "voStart": 0.15, "voEnd": 7.255, "cues": {"arrests": 1.41, "curfew": 3.45, "soe": 4.57}, "paragraphs": [0.15]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const fade = (s, t, d = 0.4) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.out" }, t);
          const cut = (s, t) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.08 }, t);
          const hide = (s, t) => tl.to(s, { opacity: 0, duration: 0.08 }, t);
          const stamp = (s, t) => tl.fromTo(s, { opacity: 0, scale: 1.25, transformOrigin: "left center" }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, t);
          const count = (s, to, t, fmt, d = 1.4) => {
            const el = document.querySelector(s), c = { v: 0 };
            el.textContent = fmt(0);
            tl.fromTo(c, { v: 0 }, { v: to, duration: d, ease: "power3.out", onUpdate: () => (el.textContent = fmt(c.v)) }, t);
          };

          const curfew = cue("curfew", 3.7), soe = cue("soe", 4.5);
          tl.set(["#crackdown-gas", "#crackdown-c2"], { opacity: 0 }, 0);
          tl.fromTo("#crackdown-police-img", { scale: 1.0 }, { scale: 1.12, duration: curfew, ease: "none" }, 0);
          cut("#crackdown-gas", curfew); hide("#crackdown-c1", curfew); cut("#crackdown-c2", curfew);
          tl.fromTo("#crackdown-gas-img", { scale: 1.14 }, { scale: 1.0, duration: T.duration - curfew, ease: "none" }, curfew);

          tl.fromTo("#crackdown-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0);
          fade("#crackdown-label", 0.15, 0.35);
          stamp("#crackdown-num", cue("arrests", 1.6));
          count("#crackdown-num", 2400, cue("arrests", 1.6), (v) => Math.round(v).toLocaleString("en-GB"), 0.9);
          stamp("#crackdown-arrested", cue("arrests", 1.6) + 0.35);
          stamp("#crackdown-curfew", curfew);
          stamp("#crackdown-soe", soe);
          tl.fromTo("#crackdown-card", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, soe + 0.9);

          tl.to(["#crackdown-stage", "#crackdown-card"], { opacity: 0, duration: 0.3, ease: "power2.in" }, T.duration - 0.35);
          window.__timelines["scene-crackdown"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
