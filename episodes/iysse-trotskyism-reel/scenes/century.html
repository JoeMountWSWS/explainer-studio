<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--tag); }
        .century-bg { position: absolute; left: 0; right: 0; top: 0; height: 1240px; overflow: hidden; }
        .century-bg img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.15); }
        #century-factory img { object-position: 30% 50%; }
        #century-dc img { object-position: 50% 50%; }
        #century-amazon img { object-position: 42% 50%; }
        #century-city img { object-position: 62% 50%; filter: grayscale(0.6) contrast(1.15); }
        #century-shade { position: absolute; inset: 0;
          background: linear-gradient(to bottom, rgba(27,33,41,0.55) 0%, rgba(27,33,41,0) 18%, rgba(27,33,41,0.1) 30%, rgba(27,33,41,0.85) 41%, rgba(27,33,41,1) 49%, rgba(27,33,41,1) 100%); }
        #century-prev { position: absolute; left: 72px; right: 140px; top: 740px; font-family: var(--font-serif); font-weight: 700; font-size: 56px; line-height: 1; color: rgba(255,255,255,0.6); }
        #century-word { position: absolute; left: 72px; right: 140px; top: 820px; font-family: var(--font-serif); font-weight: 700; font-size: 132px; line-height: 1.02; color: #ffffff; letter-spacing: -0.01em; }
        #century-word .dots { color: rgba(255,255,255,0.45); font-weight: 400; }
        #century-word .red { color: var(--red); }
        .century-credit { position: absolute; right: 72px; top: 1182px; font-size: 22px; color: rgba(255,255,255,0.75); }
      </style>

      <div id="root" data-composition-id="scene-century" data-width="1080" data-height="1920">
        <div id="century-factory" class="century-bg"><img id="century-factory-img" data-layout-allow-overflow src="assets/media/factory.jpg" alt="" /></div>
        <div id="century-dc" class="century-bg"><img id="century-dc-img" data-layout-allow-overflow src="assets/media/datacentre.jpg" alt="" /></div>
        <div id="century-amazon" class="century-bg"><img id="century-amazon-img" data-layout-allow-overflow src="assets/media/amazon.jpg" alt="" /></div>
        <div id="century-city" class="century-bg"><img id="century-city-img" data-layout-allow-overflow src="assets/media/megacity.jpg" alt="" /></div>
        <div id="century-shade"></div>

        <div id="century-prev">Trotskyism … the Socialism</div>
        <div id="century-word" data-layout-allow-overlap><span class="dots">…</span>of the<br /><span class="red">21st</span> Century</div>

        <div id="century-c1" class="century-credit byline" data-layout-allow-overlap>Electronics plant, Shenzhen. Photo: Steve Jurvetson / CC BY 2.0</div>
        <div id="century-c2" class="century-credit byline" data-layout-allow-overlap>CERN data centre. Photo: SimonWaldherr / CC BY-SA 4.0</div>
        <div id="century-c3" class="century-credit byline" data-layout-allow-overlap>Amazon workers, New York, 2021. Photo: Joe Piette / CC BY-SA 2.0</div>
        <div id="century-c4" class="century-credit byline" data-layout-allow-overlap>Hong Kong. Photo: chensiyuan / CC BY-SA 4.0</div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 3.0, "voStart": 0.15, "voEnd": 2.1, "cues": {}, "paragraphs": [0.15]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const cut = (s, t) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.06 }, t);
          const hide = (s, t) => tl.to(s, { opacity: 0, duration: 0.06 }, t);

          tl.fromTo("#century-word", { opacity: 0, scale: 1.08, transformOrigin: "left center" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, 0);

          // Four photos, hard cuts, each with a fast push: phones made, data, warehouses, the city.
          const shots = ["factory", "dc", "amazon", "city"], step = T.duration / shots.length;
          shots.forEach((s, i) => {
            const t = i * step;
            if (i > 0) {
              tl.set([`#century-${s}`, `#century-c${i + 1}`], { opacity: 0 }, 0);
              cut(`#century-${s}`, t); hide(`#century-c${i}`, t); cut(`#century-c${i + 1}`, t);
            }
            tl.fromTo(`#century-${s}-img`, { scale: 1.16 }, { scale: 1.04, duration: step + 0.1, ease: "none" }, t);
          });

          tl.to("#root > *", { opacity: 0, duration: 0.12, ease: "power2.in" }, T.duration - 0.12);
          window.__timelines["scene-century"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
