<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; background: var(--tag); }
        #trotskyism-photo { position: absolute; left: 0; right: 0; top: 0; height: 1240px; overflow: hidden; }
        #trotskyism-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; filter: grayscale(1) contrast(1.15); }
        #trotskyism-shade { position: absolute; inset: 0;
          background: linear-gradient(to bottom, rgba(27,33,41,0.55) 0%, rgba(27,33,41,0) 22%, rgba(27,33,41,0.1) 38%, rgba(27,33,41,0.85) 50%, rgba(27,33,41,1) 58%, rgba(27,33,41,1) 100%); }
        #trotskyism-doc { position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: var(--tag); }
        #trotskyism-cover { position: absolute; left: 343px; top: 320px; width: 380px; height: 578px; object-fit: cover; }
        #trotskyism-year { position: absolute; left: 72px; right: 140px; top: 918px; font-family: var(--font-sans); font-weight: 700; font-size: 28px; letter-spacing: 0.12em; text-transform: uppercase; color: #ffffff; }
        #trotskyism-year span { color: var(--red); }
        #trotskyism-tag { position: absolute; left: 72px; top: 240px; }
        #trotskyism-tag .tag { background: var(--red); font-size: 30px; }
        #trotskyism-word { position: absolute; left: 72px; right: 140px; top: 975px; font-family: var(--font-serif); font-weight: 700; font-size: 150px; line-height: 1; color: #ffffff; letter-spacing: -0.01em; }
        #trotskyism-bar { position: absolute; left: 72px; top: 1150px; width: 420px; height: 12px; background: var(--red); transform-origin: left center; }
        .trotskyism-credit { position: absolute; right: 72px; top: 1182px; font-size: 22px; color: rgba(255,255,255,0.75); }
      </style>

      <div id="root" data-composition-id="scene-trotskyism" data-width="1080" data-height="1920">
        <div id="trotskyism-photo"><img id="trotskyism-img" data-layout-allow-overflow src="assets/media/trotsky.jpg" alt="" /></div>
        <div id="trotskyism-shade"></div>
        <div id="trotskyism-doc">
          <img id="trotskyism-cover" src="assets/media/tp-cover.jpg" alt="" />
          <div id="trotskyism-year"><span>1938</span> · Founding of the Fourth International</div>
        </div>

        <div id="trotskyism-tag"><span class="tag">IYSSE meeting</span></div>
        <div id="trotskyism-word" data-layout-allow-overlap>Trotskyism</div>
        <div id="trotskyism-bar"></div>

        <div id="trotskyism-c1" class="trotskyism-credit byline" data-layout-allow-overlap>Leon Trotsky, early 1920s. Public domain</div>
        <div id="trotskyism-c2" class="trotskyism-credit byline" data-layout-allow-overlap>Transitional Program, Pioneer Publishers. Public domain</div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 2.4, "voStart": 0.15, "voEnd": 1.172, "cues": {}, "paragraphs": [0.15]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const cut = (s, t) => tl.fromTo(s, { opacity: 0 }, { opacity: 1, duration: 0.06 }, t);
          const hide = (s, t) => tl.to(s, { opacity: 0, duration: 0.06 }, t);

          // The hit lands on frame 0: the word stamps in with the portrait.
          tl.fromTo("#trotskyism-word", { opacity: 0, scale: 1.08, transformOrigin: "left center" }, { opacity: 1, scale: 1, duration: 0.22, ease: "power3.out" }, 0);
          tl.fromTo("#trotskyism-img", { scale: 1.12 }, { scale: 1.02, duration: T.duration, ease: "none" }, 0);
          tl.fromTo("#trotskyism-tag", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.1);
          tl.fromTo("#trotskyism-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.2);

          // Quick cut to the 1938 founding programme once the word is spoken.
          const doc = T.voEnd + 0.12;
          tl.set(["#trotskyism-doc", "#trotskyism-c2"], { opacity: 0 }, 0);
          cut("#trotskyism-doc", doc); hide("#trotskyism-c1", doc); cut("#trotskyism-c2", doc);
          tl.fromTo("#trotskyism-cover", { scale: 1.06 }, { scale: 1, duration: T.duration - doc, ease: "none" }, doc);

          // Hard cut into the next phrase: only a brief dip.
          tl.to("#root > *", { opacity: 0, duration: 0.12, ease: "power2.in" }, T.duration - 0.12);
          window.__timelines["scene-trotskyism"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
