<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #endcard-band { position: absolute; left: 0; right: 0; top: 1190px; bottom: 0; background: var(--tag); }
        #endcard-stage { display: flex; flex-direction: column; }
        #endcard-head { width: 100%; }
        #endcard-head .label { font-size: 30px; }
        #endcard-title { margin-top: 30px; font-size: 92px; line-height: 1.08; }
        #endcard-title .soft { color: var(--ink-soft); font-weight: 400; }
        #endcard-ask { margin-top: 30px; font-size: 54px; line-height: 1.25; color: var(--ink); }
        #endcard-ask .red { font-weight: 700; }
        #endcard-when { margin-top: 44px; padding-top: 28px; border-top: 6px solid var(--ink); }
        #endcard-day { font-family: var(--font-serif); font-weight: 700; font-size: 76px; line-height: 1.05; color: var(--ink); }
        #endcard-where { margin-top: 12px; font-family: var(--font-sans); font-weight: 700; font-size: 36px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-soft); }
        #endcard-url { margin-top: 30px; font-family: var(--font-sans); font-weight: 700; font-size: 60px; color: var(--red); }
      </style>

      <div id="root" data-composition-id="scene-endcard" data-width="1080" data-height="1920">
        <div class="paper"></div>
        <div id="endcard-band"></div>
        <div id="endcard-stage" class="stage-reel">
          <div id="endcard-head" class="section-head"><div id="endcard-rule" class="section-rule"></div><div id="endcard-label" class="label">IYSSE · National online meeting</div></div>
          <h1 id="endcard-title" class="headline"><span id="endcard-t1">Trotskyism:</span> <span id="endcard-t2">The Socialism</span> <span id="endcard-t3">of the 21st Century</span></h1>
          <p id="endcard-ask" class="standfirst">A 20th-century idea? <span class="red">Come and argue it out.</span></p>
          <div id="endcard-when">
            <div id="endcard-day">Sunday 25 October</div>
            <div id="endcard-where">18:30 UK time · Online</div>
            <div id="endcard-url">bit.ly/IYSSE-Oct-Nov2026</div>
          </div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = {"duration": 11.0, "voStart": 0.15, "voEnd": 7.255, "cues": {"date": 4.22}, "paragraphs": [0.15]};
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;
          const tl = gsap.timeline({ paused: true });
          const rise = (s, t, y = 30, d = 0.45) => tl.fromTo(s, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power3.out" }, t);

          // The three phrases reassemble into the full title.
          tl.fromTo("#endcard-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0);
          tl.fromTo("#endcard-label", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.1);
          rise("#endcard-t1", 0.05, 24, 0.35);
          rise("#endcard-t2", 0.2, 24, 0.35);
          rise("#endcard-t3", 0.35, 24, 0.35);
          rise("#endcard-ask", 1.0, 24);

          const date = cue("date", 4.2);
          rise("#endcard-when", date, 30);
          rise("#endcard-url", date + 0.9, 20, 0.4);

          // No exit fade: the reel ends (and loops) on this frame.
          window.__timelines["scene-endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
