[project]
name = "explainer-studio"
version = "0.1.6"
description = "Command-line studio for narrated explainer videos (HyperFrames + Kokoro TTS + ffmpeg)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "misaki>=0.9",
    "spacy>=3.8,<3.9",  # en_core_web_sm 3.8.0 is fetched on first use (voice.ensure_spacy_model)
    "num2words>=0.5",
]

[project.urls]
Homepage = "https://joemountwsws.github.io/explainer-studio/"
Documentation = "https://joemountwsws.github.io/explainer-studio/"
Repository = "https://github.com/JoeMountWSWS/explainer-studio"
Issues = "https://github.com/JoeMountWSWS/explainer-studio/issues"
Changelog = "https://github.com/JoeMountWSWS/explainer-studio/blob/main/CHANGELOG.md"

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/studio"]

# The house style ships inside the package (common.PKG_DATA); music beds and voice clips don't.
[tool.hatch.build.targets.wheel.force-include]
"brand/brand.css" = "studio/data/brand/brand.css"
"brand/frame.md" = "studio/data/brand/frame.md"
"brand/pronunciations.yaml" = "studio/data/brand/pronunciations.yaml"
"brand/fonts" = "studio/data/brand/fonts"
"brand/vendor" = "studio/data/brand/vendor"
"templates" = "studio/data/templates"
# The agent skill (`studio install-skill`); it also installs brand/frame.md and templates/script.md as references.
".claude/skills/make-explainer-video/SKILL.md" = "studio/data/skills/make-explainer-video/SKILL.md"
"AGENTS.md" = "studio/data/skills/make-explainer-video/references/agents.md"

[tool.hatch.build.targets.sdist]
only-include = [
    "tools/studio",
    "brand/brand.css",
    "brand/frame.md",
    "brand/pronunciations.yaml",
    "brand/fonts",
    "brand/vendor",
    "templates",
    ".claude/skills/make-explainer-video/SKILL.md",
    "AGENTS.md",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["studio", "conftest"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--cov", "--cov-report=term-missing:skip-covered"]

[tool.coverage.run]
source = ["studio"]
branch = true
# Runs inside the separate Chatterbox venv (voice.Chatterbox), never in the studio's own process.
omit = ["*/studio/chatterbox_worker.py"]

[tool.coverage.report]
show_missing = true
# TTS engines, ffmpeg mixing and HyperFrames rendering need models and binaries CI doesn't have.
# Raise this as coverage grows; never lower it to make a change pass.
fail_under = 74
exclude_also = ["if __name__ == .__main__.:"]
