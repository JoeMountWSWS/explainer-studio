[project]
name = "explainer-studio"
version = "0.1.3"
description = "Command-line studio for narrated explainer videos (HyperFrames + Kokoro TTS + ffmpeg)"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.12",
    "pyyaml>=6.0",
    "numpy>=2.0",
    "misaki>=0.9",
    "spacy>=3.7",
    "num2words>=0.5",
    "en-core-web-sm",
]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/studio"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]
