<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; overflow: hidden; }
        #__ID__-stage { display: flex; flex-direction: column; justify-content: center; }
        #__ID__-quote { font-size: 68px; line-height: 1.3; max-width: 1420px; }
        #__ID__-who { margin-top: 52px; padding-left: 62px; }
        #__ID__-src { margin-top: 12px; padding-left: 62px; }
      </style>

      <div id="root" data-composition-id="scene-__ID__" data-width="1920" data-height="1080">
        <div class="paper"></div>
        <div id="__ID__-stage" class="stage">
          <blockquote id="__ID__-quote" class="quote">The quotation goes here, with the <span id="__ID__-wash" class="hl">key phrase</span> washed in red.</blockquote>
          <div id="__ID__-who" class="label">Author name</div>
          <div id="__ID__-src" class="byline"><span class="italic">Work or document</span>, date</div>
        </div>
      </div>

      <script>
        (() => {
          /* <studio:timing> */
          const T = { duration: 6, voStart: 0.5, voEnd: 5.5, cues: {}, paragraphs: [0.5] };
          /* </studio:timing> */
          const cue = (name, fallback = T.voStart) => T.cues[name] ?? fallback;

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#__ID__-quote", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, 0.25);
          tl.fromTo(["#__ID__-who", "#__ID__-src"], { opacity: 0 }, { opacity: 1, duration: 0.6, stagger: 0.12 }, 1.0);
          tl.fromTo("#__ID__-wash", { backgroundSize: "0% 82%" }, { backgroundSize: "100% 82%", duration: 0.6, ease: "power2.out" }, cue("key", 2.0));

          tl.to("#__ID__-stage", { opacity: 0, duration: 0.45, ease: "power2.in" }, T.duration - 0.5);
          window.__timelines["scene-__ID__"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
