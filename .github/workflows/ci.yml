name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - tools/**
      - tests/**
      - brand/**
      - templates/**
      - episodes/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/ci.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Narration is not regenerated here: the TTS cache is gitignored and ElevenLabs needs a paid key.
# CI checks the committed artefacts (audio/vo, timing.json, index.html, scenes) instead.

jobs:
  python:
    name: Lint and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install (lockfile must be current)
        run: uv sync --locked
      - name: Ruff
        run: uvx ruff@0.17.0 check tools/ tests/
      - name: CLI smoke test
        run: |
          uv run studio --help
          uv run studio music --help
          for script in episodes/*/script.md; do
            uv run studio status "$(basename "$(dirname "$script")")"
          done
          uv run studio new ci-smoke "CI smoke"
          uv run studio status ci-smoke
      - name: Build and smoke-test the wheel outside the repo
        run: |
          uv build
          uv venv "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
          mkdir "$RUNNER_TEMP/ws" && cd "$RUNNER_TEMP/ws"
          "$RUNNER_TEMP/venv/bin/studio" --help
          "$RUNNER_TEMP/venv/bin/studio" new smoke "Smoke"
          "$RUNNER_TEMP/venv/bin/studio" status smoke
          test -f episodes/smoke/script.md
          "$RUNNER_TEMP/venv/bin/studio" install-skill
          test -f .claude/skills/make-explainer-video/SKILL.md
          test -f .claude/skills/make-explainer-video/references/agents.md

  # Unit tests need no TTS model, ffmpeg or HyperFrames: narration is faked and nothing is rendered.
  # Coverage settings (and the fail_under floor) are in [tool.coverage] in pyproject.toml.
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: write       # coverage badge and history on the python-coverage-comment-action-data branch
      pull-requests: write  # coverage comment on the PR
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          save-cache: false  # restore the cache the lint job saves; parallel saves race
      - run: uv sync --locked
      - name: pytest with coverage
        run: uv run pytest --cov-report=xml --cov-report=html
      - name: Coverage summary
        if: always() && matrix.python == '3.12'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      # PRs get a comment with the total and the coverage of changed lines; pushes to main update the
      # README badge. Fork PRs get read-only tokens, so they skip this and keep the run summary.
      - name: Coverage comment and badge
        if: >-
          matrix.python == '3.12' &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f  # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70
      - uses: actions/upload-artifact@v7
        if: always() && matrix.python == '3.12'
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

  episodes:
    name: Episodes
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          slugs=$(for s in episodes/*/script.md; do basename "$(dirname "$s")"; done | jq -R . | jq -sc .)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  check:
    name: hyperframes check (${{ matrix.slug }})
    needs: episodes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.episodes.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          save-cache: false  # restore the cache the lint job saves; parallel saves race
      - run: uv sync --locked
      - name: Copy brand into the episode
        run: uv run python -c "from studio.build import sync_brand; from studio.common import EPISODES; sync_brand(EPISODES / '${{ matrix.slug }}')"
      - name: Pinned HyperFrames version
        id: hf
        run: echo "version=$(uv run python -c 'from studio.common import HF_VERSION; print(HF_VERSION)')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-hyperframes-${{ steps.hf.outputs.version }}
      - name: Lint, layout and contrast audits
        working-directory: episodes/${{ matrix.slug }}
        run: npx --yes hyperframes@${{ steps.hf.outputs.version }} check
