name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# release-please keeps a "chore(main): release x.y.z" PR open that bumps the version in
# pyproject.toml and uv.lock and updates CHANGELOG.md from Conventional Commit messages.
# Merging that PR tags vX.Y.Z and publishes the GitHub release.

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
