name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

# release-please keeps a "chore(main): release x.y.z" PR open that bumps the version in
# pyproject.toml and uv.lock and updates CHANGELOG.md from Conventional Commit messages.
# Merging that PR tags vX.Y.Z and publishes the GitHub release. The `publish` job then attaches
# the studio bundle to that release. It is not published to PyPI: the studio reads brand/ and
# templates/ from the source tree (common.py ROOT), and the en-core-web-sm direct-URL dependency
# is not allowed on PyPI. Users clone the repo or download the bundle.

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish studio bundle
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Verify the lockfile and CLI at the tag
        run: |
          uv sync --locked
          uv run studio --help
      - name: Build bundle
        run: |
          name="explainer-studio-${TAG#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$name.tar.gz" "$TAG"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" explainer-studio-*.tar.gz explainer-studio-*.sha256 --clobber
